# ==============================================================================
# Nginx Configuration: os.hsios.in (HSIOS App Subdomain)
# Target Location on VPS: /etc/nginx/sites-available/os.hsios.in
# Symlink to: /etc/nginx/sites-enabled/os.hsios.in
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name os.hsios.in;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name os.hsios.in;

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/os.hsios.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/os.hsios.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # AEO / SEO Protection (Task 3 / F3)
    # Prevent search engines (Google, Bing, etc.) from indexing the app/portal.
    # The 'always' parameter ensures the header is sent on ALL response codes
    # (200, 301, 302, 401, 403, 404, 500, etc.).
    # --------------------------------------------------------------------------
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Proxy to the application backend
    location / {
        # Note: In Nginx, if a location block contains any add_header directive,
        # it stops inheriting parent-level add_header directives. We declare it
        # explicitly here to ensure it is always attached to proxied responses.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:3000; # Adjust to your app port or upstream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for app operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
